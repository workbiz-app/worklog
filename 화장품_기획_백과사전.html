<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>화장품 기획 백과사전</title>
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --ink:#1d2430; --sub:#6b7280; --line:#e6e8ec;
    --brand:#3b6fe0; --brand-soft:#eaf0fd; --accent:#10a37f;
    --warn:#e08a00; --danger:#d64545; --ok:#10a37f;
    --chip:#f0f2f5; --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:1240px;margin:0 auto;padding:18px 16px 80px}
  header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  header.top h1{font-size:21px;margin:0;letter-spacing:-.02em}
  header.top .tag{font-size:12px;color:var(--sub);background:var(--chip);padding:3px 9px;border-radius:999px}
  .muted{color:var(--sub);font-size:12.5px}

  /* layout */
  .grid{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
  @media(max-width:960px){.grid{grid-template-columns:1fr}}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card .hd{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
  .card .hd h2{font-size:14px;margin:0;letter-spacing:-.01em}
  .card .bd{padding:14px 16px}

  /* top controls */
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  @media(max-width:680px){.controls{grid-template-columns:1fr}}
  .field label{display:block;font-size:12px;color:var(--sub);margin:0 0 5px 2px;font-weight:600}
  select,input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;
    font:inherit;color:inherit;outline:none}
  select:focus,input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .ctx-note{font-size:12px;color:var(--sub);margin-top:6px;min-height:16px}

  /* search */
  .searchbar{display:flex;gap:8px;margin-bottom:12px}
  .searchbar input{flex:1}

  /* concept accordions */
  .concepts{display:flex;flex-direction:column;gap:10px}
  .acc{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .acc>button.acc-h{width:100%;display:flex;align-items:center;gap:10px;justify-content:space-between;
    background:#fff;border:0;padding:13px 14px;cursor:pointer;font:inherit;text-align:left;color:inherit}
  .acc>button.acc-h:hover{background:#fafbfc}
  .acc-h .left{display:flex;align-items:center;gap:10px}
  .acc-h .dot{width:9px;height:9px;border-radius:50%;background:var(--brand)}
  .acc-h .nm{font-weight:700;font-size:14px}
  .acc-h .cnt{font-size:12px;color:var(--sub);background:var(--chip);padding:2px 8px;border-radius:999px}
  .acc-h .chev{transition:transform .18s;color:var(--sub)}
  .acc.open .chev{transform:rotate(90deg)}
  .acc-body{display:none;padding:6px 12px 14px;border-top:1px solid var(--line);background:#fcfcfd}
  .acc.open .acc-body{display:block}
  .ing-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(max-width:560px){.ing-grid{grid-template-columns:1fr}}

  .ing{border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff;cursor:pointer;
    transition:border-color .12s,box-shadow .12s,background .12s;position:relative}
  .ing:hover{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .ing.added{border-color:var(--accent);background:#f1fbf7}
  .ing.added:after{content:"✓ 담음";position:absolute;top:10px;right:11px;font-size:11px;color:var(--accent);font-weight:800}
  .ing .nm{font-weight:800;font-size:14.5px;letter-spacing:-.01em;padding-right:48px;line-height:1.3}
  .ing .inci{font-size:11px;color:var(--sub);margin-top:2px}
  .ing .sens{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .ing .fn{font-size:12px;color:#5b6472;margin-top:9px;line-height:1.45}
  .ing .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line)}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--chip);color:#4b5563;white-space:nowrap}
  .pill.irr0,.pill.irr1{background:#eafaf2;color:#0c7a52}
  .pill.irr2{background:#fff6e6;color:#9a6a00}
  .pill.irr3{background:#fff1e0;color:#b06a00}
  .pill.irr4{background:#fdeceb;color:#b23a3a}
  .pill.irr5{background:#fbe2e2;color:#9e2b2b}
  .pill.cost{background:#eef2fb;color:#3258b8}
  /* 사용감 칩 */
  .s{font-size:11px;padding:2px 8px;border-radius:7px;font-weight:700;white-space:nowrap}
  .s-abs{background:#e8f1ff;color:#2b5fc4}
  .s-fresh{background:#e3f6f1;color:#0c8a66}
  .s-moist{background:#eaf7e8;color:#3a8a3a}
  .s-rich{background:#fbeede;color:#a96a1e}
  .s-clean{background:#edf7f1;color:#3a8a6a}
  .s-tack{background:#fdeede;color:#a8651c}
  .s-mat{background:#eef0f3;color:#566173}
  /* 사용감 필터 바 */
  .filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
  .filters .flabel{font-size:12px;color:var(--sub);font-weight:700;margin-right:2px}
  .fchip{font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;color:#4b5563;cursor:pointer;font-weight:600}
  .fchip:hover{border-color:var(--brand)}
  .fchip.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .fchip.clear{color:var(--sub)}
  /* 총평 요약 박스 */
  .summary-box{border:1px solid var(--line);border-radius:12px;padding:6px 14px;margin-top:12px;background:#fafbfd}
  .sb-row{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:13px}
  .sb-row+.sb-row{border-top:1px dashed var(--line)}
  .sb-k{font-weight:700;color:var(--sub);min-width:82px;font-size:12px}
  .sb-v{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .swatch{width:20px;height:20px;border-radius:6px;border:1px solid rgba(0,0,0,.14);display:inline-block;flex:none}
  /* 제형 호환성 */
  .cbadge{display:none;margin-top:7px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px}
  .ing.incompat{opacity:.5;background:#fcf7f7}
  .ing.incompat:hover{opacity:.9}
  .ing.incompat .cbadge{display:inline-block;background:#fbe2e2;color:#9e2b2b}
  .ing.best .cbadge{display:inline-block;background:#e3f6ee;color:#0c7a52}

  /* recipe panel */
  .recipe{position:sticky;top:14px}
  .recipe .list{display:flex;flex-direction:column;gap:7px;max-height:46vh;overflow:auto;padding-right:2px}
  .empty{color:var(--sub);font-size:13px;text-align:center;padding:22px 6px}
  .ritem{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:8px 9px;background:#fff}
  .ritem .ri-nm{font-weight:600;font-size:13px;flex:1;min-width:0}
  .ritem .ri-nm small{display:block;color:var(--sub);font-weight:400;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ritem .ri-irr{font-size:11px}
  .ritem button.rm{border:0;background:#f3f4f6;color:#6b7280;border-radius:7px;width:24px;height:24px;cursor:pointer;font-size:14px;line-height:1}
  .ritem button.rm:hover{background:#fde0e0;color:var(--danger)}

  .sumrow{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px dashed var(--line)}
  .sumrow b{font-weight:700}
  .btn{display:block;width:100%;padding:12px;border:0;border-radius:11px;background:var(--brand);color:#fff;font:inherit;
    font-weight:700;cursor:pointer;margin-top:12px;font-size:14.5px}
  .btn:hover{background:#2f60cf}
  .btn.ghost{background:var(--chip);color:#374151}
  .btn.ghost:hover{background:#e7eaef}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-row{display:flex;gap:8px}
  .btn-row .btn{margin-top:0}

  /* result */
  .result{margin-top:16px}
  .verdict{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;font-weight:700}
  .verdict .lv{font-size:22px}
  .v-ok{background:#eafaf2;color:#0c7a52;border:1px solid #bdebd6}
  .v-mid{background:#fff6e6;color:#9a6a00;border:1px solid #f3dca6}
  .v-warn{background:#fdeceb;color:#b23a3a;border:1px solid #f3c0bd}
  .res-sec{margin-top:14px}
  .res-sec h3{font-size:13px;margin:0 0 8px;display:flex;align-items:center;gap:7px}
  .res-sec h3 .b{font-size:11px;background:var(--chip);color:#4b5563;border-radius:999px;padding:1px 8px}
  .alert{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff;font-size:13px}
  .alert.high{border-color:#f3c0bd;background:#fef5f4}
  .alert.medium{border-color:#f3dca6;background:#fffaf0}
  .alert.low{border-color:#dfe5ee;background:#f9fbfe}
  .alert.good{border-color:#bdebd6;background:#f2fbf7}
  .alert .a-h{font-weight:700;font-size:12.5px;margin-bottom:3px;display:flex;gap:6px;align-items:center}
  .sev{font-size:10.5px;padding:1px 7px;border-radius:999px;font-weight:700}
  .sev.high{background:#fbe2e2;color:#9e2b2b}.sev.medium{background:#fff1d6;color:#9a6a00}.sev.low{background:#e9eef6;color:#48566b}
  .sev.good{background:#d6f3e6;color:#0c7a52}
  .a-sub{color:var(--sub);font-size:12px;margin-top:3px}
  .costbox{display:flex;align-items:baseline;gap:8px;font-size:14px}
  .costbox .big{font-size:24px;font-weight:800;letter-spacing:-.02em}
  .footnote{font-size:11.5px;color:var(--sub);margin-top:6px}
  .qa{font-size:12px;color:var(--sub);border-top:1px dashed var(--line);margin-top:14px;padding-top:10px}
  .badge-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .tagk{font-size:11px;background:#eef2fb;color:#3258b8;border-radius:6px;padding:1px 6px}
  .hidden{display:none!important}
  .pulse{font-size:12px;color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>화장품 기획 백과사전</h1>
    <span class="tag">컨셉 · 제형 · 카테고리 기반 처방 시뮬레이터</span>
    <span class="tag" id="db-count">로딩…</span>
  </header>

  <!-- 카테고리 / 제형 -->
  <div class="controls">
    <div class="field">
      <label>제품 카테고리</label>
      <select id="sel-cat"></select>
      <div class="ctx-note" id="cat-note"></div>
    </div>
    <div class="field">
      <label>제형 (텍스처 / 전달 시스템)</label>
      <select id="sel-form"></select>
      <div class="ctx-note" id="form-note"></div>
    </div>
  </div>

  <div class="grid">
    <!-- 왼쪽: 컨셉 성분 -->
    <div class="card">
      <div class="hd">
        <h2>컨셉별 특화 성분</h2>
        <span class="muted">컨셉을 펼치고 성분을 클릭하면 레시피에 담깁니다</span>
      </div>
      <div class="bd">
        <div class="searchbar">
          <input type="text" id="search" placeholder="성분명·INCI 검색 (예: 나이아신아마이드, retinol, 세라마이드)">
          <button class="btn ghost" style="width:auto;margin:0;padding:11px 14px" id="btn-collapse">접기</button>
        </div>
        <div class="filters" id="filters"></div>
        <div class="concepts" id="concepts"></div>
      </div>
    </div>

    <!-- 오른쪽: 레시피 -->
    <div>
      <div class="card recipe">
        <div class="hd">
          <h2>나의 레시피</h2>
          <span class="muted"><span id="r-count">0</span>종</span>
        </div>
        <div class="bd">
          <div class="list" id="recipe-list">
            <div class="empty">아직 담은 성분이 없습니다.<br>왼쪽에서 성분을 클릭해 추가하세요.</div>
          </div>
          <div style="margin-top:10px">
            <div class="sumrow"><span>예상 원료비(100ml)</span><b id="r-cost">–</b></div>
            <div class="sumrow"><span>평균 자극도</span><b id="r-irr">–</b></div>
          </div>
          <div class="btn-row" style="margin-top:12px">
            <button class="btn" id="btn-verify">검증하기</button>
            <button class="btn ghost" style="width:42%" id="btn-clear">비우기</button>
          </div>
        </div>
      </div>

      <!-- 결과 -->
      <div class="card result hidden" id="result-card">
        <div class="hd"><h2>검증 결과</h2><span class="muted" id="res-ctx"></span></div>
        <div class="bd" id="result-body"></div>
      </div>
    </div>
  </div>
</div>

<script>

:"retinoid","b":"bha","severity":"medium","reason":"레티노이드의 턴오버 촉진과 BHA의 각질·피지 박리가 겹쳐 자극·건조·박리 과다로 장벽이 약해질 수 있다.","advice":"동시 레이어링보다 시간대/요일 분리 권장. 지성·여드름성은 BHA 아침, 레티노이드 저녁으로 분리하고 보습 강화."},{"a":"retinoid","b":"bpo","severity":"high","reason":"전통적 트레티노인은 BPO의 산화력에 의해 광분해·불활성화될 수 있고, 두 강자극제 병용은 건조·자극·홍반을 크게 가중시킨다(아다팔렌 등 일부 신형 레티노이드는 BPO와의 안정성이 개선됨).","advice":"같은 시점 혼용 금지. 아침 BPO / 저녁 레티노이드로 시간대 분리하거나 격일 사용. 안정화 복합제(아다팔렌+BPO 등)가 아니라면 직접 섞지 말 것."},{"a":"vitc_pure","b":"retinoid","severity":"low","reason":"순수 비타민C(아스코르브산)는 강산성(저pH)을 선호하고 레티노이드는 더 높은 pH에서 안정적이라 활성 안정 조건이 어긋날 수 있고, 두 활성의 누적 자극으로 홍반·건조가 늘 수 있다. 다만 직접적 화학 충돌은 아니며 시간대 분리로 충분히 관리된다.","advice":"아침 비타민C / 저녁 레티노이드로 시간대 분리가 정석. 함께 쓸 경우 보습으로 완충하고 자극을 모니터링."},{"a":"vitc_pure","b":"copper_peptide","severity":"medium","reason":"순수 비타민C는 강한 환원제이고 GHK-Cu 등 구리 펩타이드는 구리 이온 상태에 활성이 의존해, 함께 쓰면 구리가 환원되어 펩타이드 효능이 저하되고 비타민C도 산화가 촉진될 수 있다.","advice":"같은 루틴에 레이어링하지 말고 아침/저녁으로 분리하거나 요일을 나눠 사용."},{"a":"low_ph_acid","b":"peptide","severity":"medium","reason":"많은 시그널 펩타이드는 중성~약산성 pH에서 안정적인데 저pH 산성 환경에서는 가수분해·변성으로 활성이 떨어질 수 있다.","advice":"저pH 산(필링) 적용 후 pH가 회복된 뒤(또는 다른 시간대) 펩타이드를 사용. 동시 레이어링 지양."},{"a":"low_ph_acid","b":"copper_peptide","severity":"high","reason":"GHK-Cu 등 구리 펩타이드는 약알칼리~중성에서 안정적이고 강산성 저pH 환경에서는 구리-펩타이드 결합과 구조가 깨져 효능이 크게 저하된다.","advice":"산 제품과 같은 시점에 쓰지 말고 시간대를 명확히 분리(예: 산은 저녁, 구리 펩타이드는 아침)."},{"a":"low_ph_acid","b":"growth_factor","severity":"medium","reason":"성장인자(단백질)는 저pH 산성·산화 환경에서 변성·실활되기 쉬워 동시 적용 시 효능 손실 위험이 있다.","advice":"산 적용과 시간대를 분리하고, 성장인자는 피부 pH가 회복된 뒤 또는 별도 시간대에 사용."},{"a":"low_ph_acid","b":"egf","severity":"medium","reason":"EGF는 펩타이드/단백질이라 강산성 저pH에서 구조가 불안정해지고 활성이 떨어질 수 있다.","advice":"산 제품과 동시 레이어링 금지. 시간대를 나눠 EGF는 산성 환경이 중화된 뒤 적용."},{"a":"bpo","b":"vitc_pure","severity":"high","reason":"BPO는 강한 산화제, 순수 비타민C는 강한 환원제로 함께 두면 비타민C가 즉시 산화되어 갈변·실활되고 두 활성 모두 효능을 잃는다. 병용 자극도 크다.","advice":"절대 같은 시점에 섞지 말 것. 아침 비타민C / 저녁 BPO처럼 시간대를 완전히 분리."},{"a":"essential_oil","b":"aha","severity":"medium","reason":"AHA로 박리된 피부는 투과·반응성이 높아져 에센셜오일의 자극·감작·광독성 성분(특히 시트러스계)에 더 민감해진다.","advice":"산 사용 루틴에는 에센셜오일 고함량 제품을 피하고, 사용 시 자외선 차단을 철저히. 패치 테스트 권장."},{"a":"essential_oil","b":"bha","severity":"medium","reason":"BHA 박리로 장벽이 얇아진 상태에서 에센셜오일의 휘발성 자극·감작 성분이 접촉성 피부염·홍반을 유발할 수 있다.","advice":"BHA 루틴에는 무향 또는 저자극 제형 선호. 에센셜오일 제품은 시간대 분리 및 패치 테스트."},{"a":"essential_oil","b":"retinoid","severity":"medium","reason":"레티노이드로 민감·건조해진 피부에 에센셜오일의 자극·감작 성분이 더해지면 홍반·따가움·접촉성 피부염 위험이 커진다.","advice":"레티노이드 사용 시 무향·저자극 보습 위주로 구성하고 에센셜오일 고함량 제품은 피한다."},{"a":"alcohol_denat","b":"retinoid","severity":"medium","reason":"변성 알코올은 빠른 휘발과 탈지로 장벽·수분을 떨어뜨려, 가뜩이나 건조·자극을 유발하는 레티노이드의 부작용을 가중시킨다.","advice":"레티노이드 루틴에는 변성 알코올 고함량 제형을 피하고 보습·진정 성분으로 완충."},{"a":"alcohol_denat","b":"aha","severity":"medium","reason":"변성 알코올의 탈지·장벽 약화가 AHA의 박리 자극과 겹쳐 건조·홍반·따가움을 키운다.","advice":"산 제품에 변성 알코올이 고함량으로 함께 들어간 제형은 지양하고, 보습 강화 및 빈도 조절."},{"a":"aha","b":"bha","severity":"low","reason":"둘 다 화학적 각질제거제로 함께 또는 연속 사용 시 박리 작용이 중복되어 과각질제거·자극·장벽 손상 위험이 있다(병용 자체는 가능하나 강도가 합산됨).","advice":"AHA/BHA 복합 제품이라도 사용 빈도를 낮추고, 다른 강자극 활성과 겹치지 않게 조절. 보습·자외선 차단 병행."},{"a":"retinoid","b":"vitc_deriv","severity":"low","reason":"비타민C 유도체는 순수 아스코르브산보다 pH 의존성과 자극이 낮아 레티노이드와의 충돌 위험이 작지만, 두 활성의 누적 자극은 여전히 고려 대상.","advice":"유도체형은 비교적 함께 쓰기 수월하나 민감 피부는 보습으로 완충하고 자극 모니터링."},{"a":"physical_scrub","b":"retinoid","severity":"medium","reason":"물리적 스크럽의 마찰이 레티노이드로 얇아지고 민감해진 각질층에 미세 손상·홍반을 유발할 수 있다.","advice":"레티노이드 사용 기간에는 물리적 스크럽 빈도를 크게 줄이거나 중단하고 부드러운 클렌징으로 대체."},{"a":"physical_scrub","b":"aha","severity":"medium","reason":"화학적 박리(AHA)에 물리적 스크럽이 더해지면 과각질제거로 장벽이 손상되고 자극이 누적된다.","advice":"같은 날 산과 물리 스크럽 병용을 피하고, 둘 중 하나만 사용하거나 시간 간격을 충분히 둘 것."},{"a":"enzyme","b":"aha","severity":"low","reason":"효소 각질제거와 AHA 화학 박리가 겹치면 박리 강도가 합산되어 자극·건조가 늘 수 있다.","advice":"같은 루틴에 중복하지 말고 둘 중 하나만 사용하거나 요일을 분리."},{"a":"fragrance","b":"retinoid","severity":"low","reason":"착향제는 민감·자극받은 피부에서 접촉성 자극·감작을 유발할 수 있어, 레티노이드로 예민해진 피부에서는 위험이 다소 증가한다.","advice":"레티노이드 루틴에는 무향 제형을 우선 고려하고 자극 발생 시 향료 함유 제품 배제."},{"a":"physical_scrub","b":"bha","severity":"medium","reason":"BHA 화학 박리에 물리적 스크럽 마찰이 더해지면 과각질제거로 장벽 손상과 자극이 누적된다.","advice":"같은 날 BHA와 물리 스크럽 병용을 피하고 둘 중 하나만 사용. 보습으로 완충."},{"a":"low_ph_acid","b":"pdrn","severity":"medium","reason":"PDRN(폴리뉴클레오타이드)는 핵산 기반 생체 고분자로 강산성·산화 환경에서 분해·변성되어 재생 효능이 저하될 수 있다.","advice":"산 적용과 시간대를 분리하고 PDRN은 피부 pH가 회복된 뒤 또는 별도 시간대에 사용."},{"a":"essential_oil","b":"bpo","severity":"medium","reason":"BPO로 건조·자극받은 피부에 에센셜오일의 휘발성 자극·감작 성분이 더해지면 홍반·접촉성 피부염 위험이 커진다.","advice":"BPO 루틴에는 무향·저자극 보습 위주로 구성하고 에센셜오일 고함량 제품은 피한다."},{"a":"retinoid","b":"low_ph_acid","severity":"high","reason":"저pH 산성 제품은 레티노이드 자극을 증폭시키고 장벽을 약화시켜 박리·홍반·자극을 키운다.","advice":"저pH 제품 사용 후 피부 pH가 회복될 시간을 두거나 시간대를 완전히 분리한다."},{"a":"aha","b":"vitc_pure","severity":"medium","reason":"순수 비타민C와 AHA 모두 저pH라 함께 쓰면 산도가 누적되어 따가움·홍반 등 자극이 증가한다.","advice":"민감 피부는 시간대를 분리한다. 내성 피부라도 빈도를 조절하고 자극 신호를 관찰한다."},{"a":"aha","b":"copper_peptide","severity":"medium","reason":"구리펩타이드는 산성 환경에서 구리-펩타이드 결합이 불안정해지고, AHA의 저pH가 효능을 떨어뜨릴 수 있다.","advice":"구리펩타이드와 AHA는 다른 시간대(아침/저녁)로 분리해 각각의 최적 pH를 보장한다."},{"a":"bha","b":"vitc_pure","severity":"medium","reason":"BHA(저pH)와 순수 비타민C(저pH)를 동시에 쓰면 산도가 겹쳐 민감 피부에서 자극이 증가한다.","advice":"내성에 따라 시간대를 분리하고, 도입기엔 둘 중 하나만 쓰며 빈도를 조절한다."},{"a":"bpo","b":"copper_peptide","severity":"high","reason":"BPO의 산화 작용이 구리펩타이드를 산화·분해시켜 효능을 무력화한다.","advice":"두 성분은 같은 루틴에서 배제하거나 시간대를 완전히 분리한다."},{"a":"bpo","b":"peptide","severity":"medium","reason":"BPO의 산화력은 펩타이드 결합을 분해해 효능을 떨어뜨릴 수 있다.","advice":"펩타이드 세럼은 BPO와 다른 시간대에 사용한다."},{"a":"copper_peptide","b":"bha","severity":"medium","reason":"BHA의 저pH 환경에서 구리펩타이드 복합체가 불안정해져 효능이 저하될 수 있다.","advice":"BHA와 구리펩타이드는 시간대를 분리해 각각의 안정 pH를 유지한다."},{"a":"copper_peptide","b":"antioxidant","severity":"low","reason":"강한 항산화제(환원제)는 이론적으로 구리펩타이드의 구리 산화환원 상태를 흔들 수 있다는 논란이 있다.","advice":"우려되면 시간대를 분리하되, 일반적인 항산화 배합에서는 큰 문제로 보지 않는다."},{"a":"vitc_pure","b":"niacinamide","severity":"low","reason":"고온·강산 조건에서 니아신아마이드가 비타민C와 반응해 니코틴산을 생성하고 홍조를 유발한다는 속설이 있으나, 현대 안정화 제형에서는 실사용상 거의 문제되지 않는다.","advice":"대부분 함께 사용 가능하다. 매우 민감하면 시간대를 분리하거나 안정화 제형을 택한다."},{"a":"niacinamide","b":"low_ph_acid","severity":"low","reason":"니아신아마이드는 저pH에서 일부 니코틴산으로 가수분해되어 일시적 홍조를 낼 수 있으나 실제 빈도는 낮다.","advice":"민감 피부는 산 제품과 약간의 간격을 두고 니아신아마이드를 올린다."},{"a":"vitc_pure","b":"essential_oil","severity":"low","reason":"비타민C의 산화 촉진 환경에서 정유가 함께 있으면 산패·자극 가능성이 약간 높아질 수 있다.","advice":"고농도 비타민C 루틴에서는 정유 함량이 높은 제품 병용을 피하는 편이 안전하다."},{"a":"egf","b":"aha","severity":"medium","reason":"AHA의 저pH와 박리 작용이 EGF 단백질을 변성시키고 효능을 저하시킬 수 있다.","advice":"EGF와 AHA는 시간대를 분리한다(예: AHA 저녁, EGF 아침)."},{"a":"growth_factor","b":"vitc_pure","severity":"medium","reason":"순수 비타민C의 저pH 환경이 성장인자 단백질의 안정성을 떨어뜨릴 수 있다.","advice":"성장인자와 고농도 비타민C는 시간대를 분리해 사용한다."},{"a":"enzyme","b":"low_ph_acid","severity":"medium","reason":"효소(파파인·브로멜라인 등) 각질제와 저pH 산을 함께 쓰면 각질 분해가 중첩되어 자극이 커진다.","advice":"효소 필링과 산 제품은 같은 회차에 겹치지 말고 분리한다."},{"a":"fragrance","b":"aha","severity":"low","reason":"산으로 박리된 피부에 향료가 닿으면 자극·따가움이 증가할 수 있다.","advice":"각질제 사용 시기엔 무향 제품을 곁들이는 것이 안전하다."},{"a":"vitc_pure","b":"vitc_deriv","severity":"low","reason":"순수 비타민C와 유도체를 굳이 함께 쓸 실익이 적고, 제형 pH 충돌로 안정성이 떨어질 수 있다.","advice":"둘 중 목적에 맞는 하나를 선택해 사용하는 것이 효율적이다."},{"a":"adenosine","b":"low_ph_acid","severity":"low","reason":"아데노신은 강한 저pH에서 안정성이 다소 떨어질 수 있어 산 제품과 직접 혼합 시 효능이 줄 수 있다.","advice":"아데노신 주름개선 제품은 산 제품과 약간의 간격을 두고 사용한다."},{"a":"azelaic","b":"physical_scrub","severity":"low","reason":"아젤라산 사용 중 물리적 스크럽은 이미 진정·각질조절 중인 피부에 마찰 자극을 더한다.","advice":"아젤라산 루틴에서는 스크럽을 줄이고 부드럽게 관리한다."}],"synergies":[{"a":"vitc_pure","b":"vit_e","benefit":"비타민C(수용성)와 비타민E(지용성)가 항산화 네트워크를 이뤄 서로를 재생시키며, 자유라디칼 소거와 광노화 방어 효과가 상승한다."},{"a":"vitc_pure","b":"ferulic","benefit":"페룰산이 L-아스코르브산(+E) 제형의 산화 안정성을 높이고 항산화 시너지로 자외선 방어를 강화한다(클래식 CEF 조합)."},{"a":"niacinamide","b":"zinc","benefit":"나이아신아마이드의 피지·진정 효과에 아연의 피지 조절·항염이 더해져 여드름성·지성 피부의 모공·트러블 관리에 시너지를 낸다."},{"a":"ceramide","b":"occlusive","benefit":"세라마이드가 장벽 지질을 보충하고 폐색제가 수분 증발(TEWL)을 막아, 장벽 회복과 보습 지속력이 함께 향상된다."},{"a const recipe = new Set();      // inci(소문자) 집합
const byInci = new Map();      // inci -> ingredient
let curCat = null, curForm = null;

function init(){
  DB.ingredients.forEach(function(it){ byInci.set(it.inci.toLowerCase(), it); });
  document.getElementById('db-count').textContent =
    '성분 ' + DB.ingredients.length + '종 · 규칙 ' + (DB.conflicts.length+DB.synergies.length);

  buildCategorySelect();
  buildFormSelect();
  buildConcepts();
  buildFilters();

  document.getElementById('search').addEventListener('input', applyFilters);
  document.getElementById('btn-collapse').addEventListener('click', collapseAll);
  document.getElementById('btn-verify').addEventListener('click', verify);
  document.getElementById('btn-clear').addEventListener('click', clearRecipe);
  renderRecipe();
}

function buildCategorySelect(){
  const s=document.getElementById('sel-cat');
  s.innerHTML='<option value="">— 카테고리 선택 —</option>'+DB.categories.map(function(c,i){
    return '<option value="'+i+'">'+esc(c.name)+'</option>';}).join('');
  s.addEventListener('change',function(){
    curCat = this.value===''?null:DB.categories[+this.value];
    curForm = null;
    document.getElementById('cat-note').textContent = curCat
      ? (curCat.desc+' · 권장 pH '+curCat.phMin+'~'+curCat.phMax+' · 활성함량 '+curCat.activeLoad+' · '+curCat.note) : '';
    populateForms();
    markCompat(); applyFilters();
  });
}
function populateForms(){
  const s=document.getElementById('sel-form');
  const note=document.getElementById('form-note');
  note.textContent='';
  if(!curCat){
    s.disabled=true;
    s.innerHTML='<option value="">— 카테고리 먼저 선택 —</option>';
    return;
  }
  s.disabled=false;
  s.innerHTML='<option value="">— 제형 선택 ('+(curCat.forms||[]).length+'종) —</option>'
    +(curCat.forms||[]).map(function(f,i){ return '<option value="'+i+'">'+esc(f.name)+'</option>'; }).join('');
}
function buildFormSelect(){
  const s=document.getElementById('sel-form');
  s.disabled=true;
  s.innerHTML='<option value="">— 카테고리 먼저 선택 —</option>';
  s.addEventListener('change',function(){
    curForm = (this.value===''||!curCat)?null:curCat.forms[+this.value];
    document.getElementById('form-note').textContent = curForm
      ? (curForm.base+(curForm.note?(' · '+curForm.note):'')) : '';
    markCompat(); applyFilters();
  });
}

function ingsForConcept(key){
  return DB.ingredients.filter(function(it){ return (it.concepts||[]).indexOf(key)!==-1; });
}
function buildConcepts(){
  const host=document.getElementById('concepts');
  const present = CONCEPT_ORDER.filter(function(k){ return ingsForConcept(k).length>0; });
  // 순서에 없는 컨셉도 뒤에 추가
  const extra = {};
  DB.ingredients.forEach(function(it){(it.concepts||[]).forEach(function(c){
    if(CONCEPT_ORDER.indexOf(c)===-1) extra[c]=1;});});
  const keys = present.concat(Object.keys(extra));
  host.innerHTML = keys.map(function(k){
    const list = ingsForConcept(k);
    return ''
    + '<div class="acc" data-k="'+esc(k)+'">'
    +   '<button class="acc-h" onclick="toggleAcc(this)">'
    +     '<span class="left"><span class="dot"></span><span class="nm">'+esc(k)+'</span>'
    +       '<span class="cnt">'+list.length+'</span></span>'
    +     '<span class="chev">▶</span>'
    +   '</button>'
    +   '<div class="acc-body"><div class="ing-grid">'
    +     list.map(ingCard).join('')
    +   '</div></div>'
    + '</div>';
  }).join('');
  syncCards();
}
function ingCard(it){
  const id=it.inci.toLowerCase();
  return ''
  +'<div class="ing" data-id="'+esc(id)+'" onclick="toggleIng(\''+escJs(id)+'\')">'
  +'<div class="nm">'+esc(it.ko)+'</div>'
  +'<div class="inci">'+esc(it.inci)+'</div>'
  +'<div class="cbadge"></div>'
  +'<div class="sens">'+sensPills(it.sensory)+'</div>'
  +'<div class="fn">'+esc(it.func||'')+'</div>'
  +'<div class="meta">'
  +'<span class="pill irr'+ (it.irr||0) +'">자극 '+(it.irr||0)+'/5</span>'
  +'<span class="pill cost">~'+won(it.cost||0)+'/100ml</span>'
  +(it.pct?'<span class="pill">'+esc(it.pct)+'</span>':'')
  +'</div></div>';
}
function sensPills(s){
  if(!s||!s.absorb) return '';
  const finCls={'산뜻':'s-fresh','촉촉':'s-moist','리치':'s-rich'}[s.finish]||'s-moist';
  let h='<span class="s s-abs">흡수 '+esc(s.absorb)+'</span>';
  h+='<span class="s '+finCls+'">'+esc(s.finish)+'</span>';
  if(s.tack==='적음') h+='<span class="s s-clean">무끈적</span>';
  else if(s.tack==='있음') h+='<span class="s s-tack">끈적임</span>';
  if(s.feel && s.feel.indexOf('매트')>=0) h+='<span class="s s-mat">매트</span>';
  return h;
}
function productColor(items){
  const tints=[];
  items.forEach(function(it){
    const nm=it.ko+' '+it.inci, tg=it.tags||[];
    if(/kaolin|bentonite|\bclay\b|카올린|벤토나이트|클레이|백토|차콜|charcoal/i.test(nm)) tints.push({c:'clay',hex:'#cdc4ad',l:'회베이지(클레이/차콜)'});
    else if(tg.indexOf('vitc_pure')>=0) tints.push({c:'vitc',hex:'#f1da90',l:'연노랑(순수 비타민C·산화 시 진해짐)'});
    else if(tg.indexOf('retinoid')>=0) tints.push({c:'retinoid',hex:'#f0e0a6',l:'연노랑(레티노이드)'});
    else if(/폴리페놀|피크노제놀|레스베라트롤|오리자놀|닥나무|탄닌|tannin/i.test(nm)) tints.push({c:'poly',hex:'#d6c096',l:'연갈색(폴리페놀·식물추출)'});
    else if(tg.indexOf('ferment')>=0) tints.push({c:'ferment',hex:'#e6d7bd',l:'옅은 베이지(발효 여과물)'});
    else if(tg.indexOf('centella')>=0||/녹차|감초|어성초|마치현|병풀|쑥|추출물/i.test(nm)) tints.push({c:'botan',hex:'#dbdfc1',l:'옅은 황록(식물 추출)'});
    else if(tg.indexOf('emollient')>=0||tg.indexOf('occlusive')>=0||/버터|\boil\b|오일|토코페|시어/i.test(nm)) tints.push({c:'oil',hex:'#efe5c2',l:'미색(유분/오일)'});
  });
  return tints;
}
function resolveColor(items, form){
  const tints=productColor(items);
  const PRIO=['clay','vitc','poly','retinoid','ferment','botan','oil'];
  if(tints.length){
    let best=null;
    PRIO.forEach(function(c){ if(!best){ const m=tints.filter(function(t){return t.c===c;}); if(m.length) best=m[0]; } });
    const cats={}; tints.forEach(function(t){cats[t.c]=1;});
    return {label:best.l, hex:best.hex, multi:Object.keys(cats).length>=3};
  }
  const base=(form&&form.base)||'';
  if(/에멀전|emulsion|크림|로션|밀크/i.test(base)) return {label:'유백색 / 화이트', hex:'#f7f5ef', multi:false};
  if(/무수|앤하이드러스|오일/i.test(base)) return {label:'미색 투명 오일', hex:'#f1ead2', multi:false};
  if(/무기|자차|분산/i.test(base)) return {label:'화이트(무기 필터)', hex:'#f4f4f2', multi:false};
  return {label:'무색 투명', hex:'#eaf2fb', multi:false};
}

function toggleAcc(btn){ btn.parentElement.classList.toggle('open'); }
function collapseAll(){ document.querySelectorAll('.acc.open').forEach(function(a){a.classList.remove('open');}); }

function toggleIng(id){
  if(recipe.has(id)) recipe.delete(id); else recipe.add(id);
  syncCards(); renderRecipe();
}
function syncCards(){
  document.querySelectorAll('.ing').forEach(function(el){
    el.classList.toggle('added', recipe.has(el.getAttribute('data-id')));
  });
}

function renderRecipe(){
  const list=document.getElementById('recipe-list');
  document.getElementById('r-count').textContent = recipe.size;
  if(recipe.size===0){
    list.innerHTML='<div class="empty">아직 담은 성분이 없습니다.<br>왼쪽에서 성분을 클릭해 추가하세요.</div>';
    document.getElementById('r-cost').textContent='–';
    document.getElementById('r-irr').textContent='–';
    document.getElementById('btn-verify').disabled=true;
    return;
  }
  document.getElementById('btn-verify').disabled=false;
  const items=selected();
  list.innerHTML=items.map(function(it){
    const id=it.inci.toLowerCase();
    return '<div class="ritem">'
      +'<div class="ri-nm">'+esc(it.ko)+'<small>'+esc(it.inci)+'</small></div>'
      +'<span class="ri-irr pill irr'+(it.irr||0)+'">'+(it.irr||0)+'</span>'
      +'<button class="rm" title="삭제" onclick="toggleIng(\''+escJs(id)+'\')">×</button>'
      +'</div>';
  }).join('');
  const cost=items.reduce(function(s,it){return s+(it.cost||0);},0);
  const irr=items.reduce(function(s,it){return s+(it.irr||0);},0)/items.length;
  document.getElementById('r-cost').textContent='~'+won(cost)+'원';
  document.getElementById('r-irr').textContent=irr.toFixed(1)+'/5';
}
function clearRecipe(){ recipe.clear(); syncCards(); renderRecipe();
  document.getElementById('result-card').classList.add('hidden'); }

function selected(){
  const r=[];
  recipe.forEach(function(id){ const it=byInci.get(id); if(it) r.push(it); });
  return r;
}

/* ---------- 사용감 필터 ---------- */
const FEELS=[
  {k:'흡수빠름', t:'흡수 빠름', f:function(it){return it.sensory&&it.sensory.absorb==='빠름';}},
  {k:'흡수느림', t:'흡수 느림', f:function(it){return it.sensory&&it.sensory.absorb==='느림';}},
  {k:'산뜻', t:'산뜻', f:function(it){return it.sensory&&it.sensory.finish==='산뜻';}},
  {k:'촉촉', t:'촉촉', f:function(it){return it.sensory&&it.sensory.finish==='촉촉';}},
  {k:'리치', t:'리치', f:function(it){return it.sensory&&it.sensory.finish==='리치';}},
  {k:'무끈적', t:'무끈적', f:function(it){return it.sensory&&it.sensory.tack==='적음';}},
  {k:'저자극', t:'저자극 ≤1', f:function(it){return (it.irr||0)<=1;}}
];
const activeFeel=new Set();
function buildFilters(){
  const host=document.getElementById('filters');
  host.innerHTML='<span class="flabel">사용감 필터</span>'
    +FEELS.map(function(x){return '<button class="fchip" data-k="'+esc(x.k)+'" onclick="toggleFeel(this)">'+esc(x.t)+'</button>';}).join('')
    +'<button class="fchip clear" onclick="clearFeel()">초기화</button>'
    +'<span class="flabel" style="margin-left:6px">제형</span>'
    +'<button class="fchip" id="compatChip" style="display:none" onclick="toggleCompat(this)">이 제형 호환만</button>';
}
function toggleFeel(btn){
  const k=btn.getAttribute('data-k');
  if(activeFeel.has(k)){ activeFeel.delete(k); btn.classList.remove('on'); }
  else { activeFeel.add(k); btn.classList.add('on'); }
  applyFilters();
}
function clearFeel(){ activeFeel.clear(); document.querySelectorAll('.fchip.on').forEach(function(b){b.classList.remove('on');}); compatOnly=false; applyFilters(); }

/* ---------- 제형 호환성 ---------- */
let compatOnly=false;
function compat(it, form){
  if(!form||!it) return {lv:'ok'};
  const tg=it.tags||[], avoid=form.avoid||[], base=form.base||'';
  const bad=tg.filter(function(t){return avoid.indexOf(t)>=0;});
  if(bad.length) return {lv:'no', why:'✕ '+form.name+' 부적합 · '+bad.map(tlabel).join('·')};
  if(/무수|앤하이드러스|왁스/.test(base)){
    const ws=['ha','humectant','niacinamide','tranexamic','arbutin','aha','bha','pha','pdrn','egf','growth_factor','ferment','vitc_deriv'];
    if(tg.some(function(t){return ws.indexOf(t)>=0;})) return {lv:'no', why:'✕ 무수 제형엔 부적합 · 수용성'};
  }
  return {lv:'ok'};
}
function markCompat(){
  document.querySelectorAll('.ing').forEach(function(el){
    const it=byInci.get(el.getAttribute('data-id'));
    const cb=el.querySelector('.cbadge');
    const c=compat(it,curForm);
    el.classList.toggle('incompat', c.lv==='no');
    if(cb) cb.textContent = c.lv==='no' ? c.why : '';
  });
  const chip=document.getElementById('compatChip');
  if(chip){ chip.style.display = curForm ? '' : 'none'; if(!curForm){ compatOnly=false; chip.classList.remove('on'); } }
}
function toggleCompat(btn){ if(!curForm) return; compatOnly=!compatOnly; btn.classList.toggle('on',compatOnly); applyFilters(); }

function applyFilters(){
  const q=(document.getElementById('search').value||'').trim().toLowerCase();
  const feels=FEELS.filter(function(x){return activeFeel.has(x.k);});
  const narrowing = q!=='' || feels.length>0;
  const compatActive = compatOnly && !!curForm;
  const anyFilter = narrowing || compatActive;
  document.querySelectorAll('.acc').forEach(function(acc){
    let any=false;
    acc.querySelectorAll('.ing').forEach(function(el){
      const it=byInci.get(el.getAttribute('data-id'));
      let ok=true;
      if(q) ok=(it.ko+' '+it.inci+' '+(it.func||'')).toLowerCase().indexOf(q)>=0;
      if(ok && feels.length) ok=feels.every(function(x){return x.f(it);});
      if(ok && compatActive) ok=compat(it,curForm).lv!=='no';
      el.classList.toggle('hidden', !ok); if(ok) any=true;
    });
    acc.classList.toggle('hidden', anyFilter && !any);
    if(narrowing) acc.classList.toggle('open', any); else if(!anyFilter) acc.classList.remove('open');
    const cnt=acc.querySelector('.cnt');
    if(cnt){ const total=acc.querySelectorAll('.ing').length, vis=acc.querySelectorAll('.ing:not(.hidden)').length;
      cnt.textContent = anyFilter ? (vis+'/'+total) : total; }
  });
}

/* ---------- 검증 엔진 ---------- */
function tagSet(items){
  const s=new Set();
  items.forEach(function(it){ (it.tags||[]).forEach(function(t){ s.add(t); }); });
  return s;
}
function carriersOf(items,tag){
  return items.filter(function(it){ return (it.tags||[]).indexOf(tag)!==-1; }).map(function(it){return it.ko;});
}

function verify(){
  const items=selected();
  if(items.length===0) return;
  const tags=tagSet(items);

  // 1) 충돌
  const hits=[];
  DB.conflicts.forEach(function(c){
    if(c.a!==c.b && tags.has(c.a) && tags.has(c.b)){
      hits.push({c:c, who:carriersOf(items,c.a).concat(carriersOf(items,c.b))});
    }
  });
  // 2) 시너지
  const syn=[];
  DB.synergies.forEach(function(s){ if(s.a!==s.b && tags.has(s.a) && tags.has(s.b)) syn.push(s); });

  // 3) 자극도 점수
  const irrAvg=items.reduce(function(s,it){return s+(it.irr||0);},0)/items.length;
  const highCount=items.filter(function(it){return (it.irr||0)>=4;}).length;
  const acidCarriers=items.filter(function(it){ const t=it.tags||[];
    return t.indexOf('low_ph_acid')!==-1||t.indexOf('aha')!==-1||t.indexOf('bha')!==-1; }).length;
  let score=irrAvg + highCount*0.5 + (acidCarriers>=2?(acidCarriers-1)*0.6:0);
  // 자극원 플래그
  const flags=[];
  if(tags.has('essential_oil')||tags.has('fragrance')){ score+=0.8; flags.push('향료/정유 함유'); }
  if(tags.has('alcohol_denat')){ score+=0.6; flags.push('변성알코올 함유'); }
  if(tags.has('bpo')){ score+=1.0; flags.push('벤조일퍼옥사이드(고자극)'); }
  if(tags.has('retinoid')){ flags.push('레티노이드 함유(초기 자극 가능)'); }
  // 충돌 가중
  hits.forEach(function(h){ score += h.c.severity==='high'?2:(h.c.severity==='medium'?1:0.2); });
  // 제형/카테고리 보정
  const ctxNotes=[];
  if(curForm){ score+=(curForm.irrMod||0);
    if(curForm.irrMod>0.5) ctxNotes.push('제형("'+curForm.name+'")이 물리적 자극을 더합니다.');
    if(curForm.irrMod<0) ctxNotes.push('제형("'+curForm.name+'")이 자극을 다소 완화합니다.'); }
  if(curCat){ if(curCat.activeLoad==='고') score+=0.5;
    else if(curCat.activeLoad==='저') score-=0.3; }

  let level,cls,emo;
  if(score<2.0){ level='순함 / 저자극'; cls='v-ok'; emo='🟢'; }
  else if(score<3.6){ level='보통 / 관리형'; cls='v-mid'; emo='🟡'; }
  else if(score<5.2){ level='다소 높음 / 주의'; cls='v-warn'; emo='🟠'; }
  else { level='높음 / 민감주의'; cls='v-warn'; emo='🔴'; }

  // 4) 제형 적합성 (제형 avoid = 부적합 클래스태그)
  const formIssues=[]; let formFit=0;
  if(curForm){
    const avoid=curForm.avoid||[], supports=curForm.supports||[];
    items.forEach(function(it){
      const tg=it.tags||[];
      const bad=tg.filter(function(t){ return avoid.indexOf(t)>=0; });
      if(bad.length) formIssues.push(it.ko+'('+bad.map(tlabel).join('·')+') → '+curForm.name+' 제형에 부적합');
      if(tg.some(function(t){ return supports.indexOf(t)>=0; })) formFit++;
    });
    if(curForm.base && curForm.base.indexOf('무수')!==-1){
      const water=items.filter(function(it){const t=it.tags||[];
        return t.indexOf('ha')!==-1||t.indexOf('humectant')!==-1;});
      if(water.length) formIssues.push('무수('+curForm.name+') 제형에 수용성 보습 성분('+water.map(function(x){return x.ko;}).join(', ')+')은 용해·효능 저하');
    }
    if(formFit>0 && formIssues.length===0) ctxNotes.push('제형("'+curForm.name+'")에 적합한 성분 '+formFit+'종 포함 — 상성 양호.');
  }
  // 5) pH 적합성
  const phIssues=[];
  if(curCat){
    items.forEach(function(it){
      if(it.phMax!=null && it.phMax < curCat.phMin)
        phIssues.push(it.ko+'(효력 pH ≤'+it.phMax+')은 카테고리 권장 pH('+curCat.phMin+'~'+curCat.phMax+')보다 낮은 pH가 필요');
      if(it.phMin!=null && it.phMin > curCat.phMax)
        phIssues.push(it.ko+'(효력 pH ≥'+it.phMin+')은 카테고리 권장 pH 범위를 초과');
    });
  }
  if(tags.has('vitc_pure')) phIssues.push('순수 비타민C는 pH 3 미만의 산성·산화 안정화 설계가 필요(완제품 안정성 핵심)');

  // 6) 단가
  const matCost=items.reduce(function(s,it){return s+(it.cost||0);},0);
  const baseCost=curForm?(curForm.costBase||0):1000;
  const total=matCost+baseCost;
  const lo=Math.round(total*0.8/100)*100, hi=Math.round(total*1.25/100)*100;

  // 7) 예상 사용감
  function modeOf(arr){var c={},best=arr[0]||'',bn=0;arr.forEach(function(x){c[x]=(c[x]||0)+1;});for(var k in c){if(c[k]>bn){bn=c[k];best=k;}}return best;}
  const fin=modeOf(items.map(function(it){return (it.sensory||{}).finish||'촉촉';}));
  const abs=modeOf(items.map(function(it){return (it.sensory||{}).absorb||'보통';}));
  let texture='마무리 '+fin+' · 흡수 '+abs;
  if(curForm && /무수/.test(curForm.base||'')) texture+=' · 제형상 오일리/리치 경향';
  else if(curForm && /수상 단독|워터/.test(curForm.base||'')) texture+=' · 제형상 산뜻 경향';
  const color=resolveColor(items, curForm);

  renderResult({level:level,cls:cls,emo:emo,score:score,irrAvg:irrAvg,
    hits:hits,syn:syn,flags:flags,ctxNotes:ctxNotes,formIssues:formIssues,phIssues:phIssues,
    matCost:matCost,baseCost:baseCost,lo:lo,hi:hi,count:items.length,texture:texture,color:color});
}

function renderResult(r){
  const card=document.getElementById('result-card');
  document.getElementById('res-ctx').textContent=
    (curCat?curCat.name:'카테고리 미선택')+' · '+(curForm?curForm.name:'제형 미선택');
  let h='';
  h+='<div class="verdict '+r.cls+'"><span class="lv">'+r.emo+'</span><div>'
    +'<div>자극도 판정: '+r.level+'</div>'
    +'<div class="muted" style="font-weight:400">종합 자극지수 '+r.score.toFixed(1)+' · 성분 평균 '+r.irrAvg.toFixed(1)+'/5 · '+r.count+'종</div>'
    +'</div></div>';
  h+='<div class="summary-box">';
  if(r.texture) h+='<div class="sb-row"><span class="sb-k">예상 사용감</span><span class="sb-v">'+esc(r.texture)+'</span></div>';
  if(r.color) h+='<div class="sb-row"><span class="sb-k">예상 제형 색</span><span class="sb-v"><span class="swatch" style="background:'+esc(r.color.hex)+'"></span>'+esc(r.color.label)+(r.color.multi?' · 다색 혼합 → 탁해질 수 있음':'')+'</span></div>';
  h+='</div>';

  // 충돌
  h+='<div class="res-sec"><h3>성분 충돌 <span class="b">'+r.hits.length+'</span></h3>';
  if(r.hits.length===0){ h+='<div class="alert good"><div class="a-h"><span class="sev good">안전</span>충돌 없음</div>'
    +'<div class="a-sub">선택 성분 간 알려진 배합 충돌이 감지되지 않았습니다.</div></div>'; }
  else { r.hits.sort(function(a,b){return sev(b.c.severity)-sev(a.c.severity);});
    r.hits.forEach(function(h2){ const c=h2.c;
      h+='<div class="alert '+c.severity+'"><div class="a-h"><span class="sev '+c.severity+'">'
        +(c.severity==='high'?'높음':c.severity==='medium'?'주의':'참고')+'</span>'
        +esc(tlabel(c.a))+' ✕ '+esc(tlabel(c.b))+'</div>'
        +'<div>'+esc(c.reason)+'</div>'
        +'<div class="a-sub">▸ '+esc(c.advice)+'</div>'
        +'<div class="a-sub">관련: '+esc(uniq(h2.who).join(', '))+'</div></div>';
    });
  }
  h+='</div>';

  // 시너지
  if(r.syn.length){
    h+='<div class="res-sec"><h3>긍정 시너지 <span class="b">'+r.syn.length+'</span></h3>';
    r.syn.forEach(function(s){ h+='<div class="alert good"><div class="a-h"><span class="sev good">시너지</span>'
      +esc(tlabel(s.a))+' + '+esc(tlabel(s.b))+'</div><div>'+esc(s.benefit)+'</div></div>'; });
    h+='</div>';
  }

  // 자극·제형·pH 메모
  const memo=[];
  r.flags.forEach(function(f){memo.push(['자극원',f]);});
  r.formIssues.forEach(function(f){memo.push(['제형',f]);});
  r.phIssues.forEach(function(f){memo.push(['pH',f]);});
  r.ctxNotes.forEach(function(f){memo.push(['보정',f]);});
  if(memo.length){
    h+='<div class="res-sec"><h3>처방 체크포인트 <span class="b">'+memo.length+'</span></h3>';
    memo.forEach(function(m){ h+='<div class="alert medium"><div class="a-h"><span class="sev medium">'+m[0]+'</span></div>'
      +'<div>'+esc(m[1])+'</div></div>'; });
    h+='</div>';
  }

  // 단가
  h+='<div class="res-sec"><h3>예상 원료비 (100ml 기준)</h3>'
    +'<div class="alert"><div class="costbox"><span class="big">'+won(r.lo)+' ~ '+won(r.hi)+'원</span></div>'
    +'<div class="footnote">활성 원료비 ~'+won(r.matCost)+'원 + 제형 베이스 ~'+won(r.baseCost)+'원 기준 추정치. '
    +'부자재(용기·라벨)·임가공·향·색소·마진 제외. <b>참고용 대략치</b>입니다.</div></div></div>';

  if(DB.qa){ h+='<div class="qa">데이터 노트: '+esc(DB.qa)+'</div>'; }

  document.getElementById('result-body').innerHTML=h;
  card.classList.remove('hidden');
  card.scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* ---------- 유틸 ---------- */
function sev(s){ return s==='high'?3:s==='medium'?2:1; }
function uniq(a){ return a.filter(function(v,i){return a.indexOf(v)===i;}); }
function won(n){ return (Math.round(n)||0).toLocaleString('ko-KR'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function escJs(s){ return String(s).replace(/'/g,"\\'"); }

init();
</script>
